<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フリップボード</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<section id="login">
  <form id="login-form" class="board">
    <h1>フリップボード</h1>
    <input id="login-name" placeholder="名前" aria-label="名前" maxlength="20" autocomplete="nickname" required>
    <input id="login-room" placeholder="Room ID" aria-label="Room ID" maxlength="32" autocomplete="off" required>
    <button>入室</button>
    <p id="login-error" role="alert"></p>
  </form>
</section>

<div id="room" hidden>
  <header>
    <strong id="room-id"></strong>
    <span id="net" hidden>再接続中…</span>
    <label class="volume push">音量<input id="volume" type="range" min="0" max="100"></label>
    <button id="master-btn"></button>
    <button id="leave">退出</button>
  </header>

  <main>
    <section id="desk">
      <fieldset id="tools">
        <button id="tool-pen" title="ペン (B)">ペン<kbd>B</kbd></button>
        <button id="tool-eraser" title="消しゴム (E)">消しゴム<kbd>E</kbd></button>
        <span id="swatches"></span>
        <input id="color" type="color" value="#111111" aria-label="色">
        <input id="width" type="range" min="1" max="120" title="太さ ([ / ])" aria-label="太さ">
        <button id="undo" title="元に戻す (Ctrl+Z)" aria-label="元に戻す">↶</button>
        <button id="redo" title="やり直す (Ctrl+Y)" aria-label="やり直す">↷</button>
        <button id="clear" title="全消去 (Delete)">全消去</button>
      </fieldset>
      <div id="surface">
        <canvas id="canvas" width="1200" height="900"></canvas>
        <div id="brush" hidden></div>
        <span id="live" hidden>公開中</span>
      </div>
      <button id="flip-btn"></button>
    </section>

    <section id="hall">
      <div id="master" hidden>
        <div>
          <button id="all-open">全員公開</button>
          <button id="all-close">全員非公開</button>
          <button id="reset-flips">全員リセット</button>
          <label><input id="lock" type="checkbox">公開禁止</label>
        </div>
        <div>
          <button id="judge" class="strong">正誤表示</button>
          <button id="clear-judge">正誤クリア</button>
        </div>
        <div>
          <button id="snd-correct" class="red">正解音</button>
          <button id="snd-wrong" class="blue">不正解音</button>
        </div>
        <div>
          <button id="reset-scores">点数リセット</button>
        </div>
      </div>
      <ul id="tiles"></ul>
    </section>
  </main>
</div>

<template id="tile-tmpl">
  <li class="tile">
    <div class="flip">
      <div class="flip-inner">
        <div class="face front"><img alt="" hidden></div>
        <div class="face back"></div>
      </div>
    </div>
    <div class="who">
      <span class="name"></span>
      <span class="role" hidden>マスター</span>
      <span class="score"></span>
      <span class="adjust" hidden>
        <button class="minus" aria-label="1点減らす">−</button>
        <input class="pts" type="number" aria-label="点数">
        <button class="plus" aria-label="1点増やす">+</button>
      </span>
    </div>
    <div class="ctl" hidden>
      <label><input class="ok" type="checkbox">正解</label>
      <button class="toggle"></button>
    </div>
  </li>
</template>

<script type="module" src="/app.js"></script>
</body>
</html>
